name: Render board

# Plots every signal layer of the board (copper + board outline, no silkscreen)
# as an SVG and force-pushes them as a single commit to the `renders` branch,
# so the branch only ever holds the latest plots. README.md embeds them from there.
on:
  push:
    branches: [main]
    paths:
      - 'kicad/**.kicad_pcb'
      - '.github/workflows/render.yml'
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    # root: the image's default user can't write to the Actions workspace.
    container:
      image: kicad/kicad:10.0
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Plot signal layers
        run: |
          set -eu
          kicad-cli version
          mkdir -p out
          for pcb in kicad/*.kicad_pcb; do
            # Copper layers of type "signal" in the board's layer stack (planes are type "power").
            for layer in $(grep -oP '^\t\t\(\d+ "\K[^"]+(?=" signal)' "$pcb"); do
              out="out/${layer/./_}.svg"
              mirror=""
              [ "$layer" = B.Cu ] && mirror="--mirror"   # bottom as seen from below
              kicad-cli pcb export svg --mode-single --layers "$layer,Edge.Cuts" \
                --theme _builtin_default --page-size-mode 2 --exclude-drawing-sheet \
                $mirror -o "$out" "$pcb"
              # KiCad's board background, so the plot reads the same in GitHub's light and dark themes.
              sed -i -E '0,/<title>/s|(<title>)|<rect x="0" y="0" width="100%" height="100%" fill="#001023"/>\n\1|' "$out"
            done
          done
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: board-plots
          path: out/*.svg
          if-no-files-found: error

  publish:
    needs: render
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: board-plots
          path: out

      - name: Force-push to the renders branch
        run: |
          set -eu
          cd out
          git init -q -b renders
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Board plots for ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" renders
